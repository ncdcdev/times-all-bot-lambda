name: Reusable - Deploy

on:
  workflow_call:
    secrets:
      SLACK_BOT_TOKEN:
        required: true
      SLACK_SIGNING_SECRET:
        required: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
          cache-dependency-path: |
            pnpm-lock.yaml
            infra/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: infra

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ap-northeast-1

      - run: pnpm run deploy --require-approval never
        working-directory: infra
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_SIGNING_SECRET: ${{ secrets.SLACK_SIGNING_SECRET }}
          TIMES_ALL_CHANNEL_ID: ${{ vars.TIMES_ALL_CHANNEL_ID }}
          WORKSPACE_URL: ${{ vars.WORKSPACE_URL }}
