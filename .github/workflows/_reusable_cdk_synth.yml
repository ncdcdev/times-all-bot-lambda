name: Reusable - CDK Synth

on:
  workflow_call:

jobs:
  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@731dfb6463bbd11c11fd0ee11fe00ed0e36d48a1 # v3.2.0
        with:
          cache: true
          require-lockfile: true
          cache-dependency-path: |
            pnpm-lock.yaml
            infra/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: infra

      - name: CDK Synth
        run: pnpm run synth
        working-directory: infra
        env:
          SLACK_BOT_TOKEN: dummy
          SLACK_SIGNING_SECRET: dummy
          TIMES_ALL_CHANNEL_ID: C0000000000
          WORKSPACE_URL: https://dummy.slack.com
