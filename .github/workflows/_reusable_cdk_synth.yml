name: Reusable - CDK Synth

on:
  workflow_call:

jobs:
  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/setup@fa36a5ef7dcdefc3a7cb25655c122e00cf6e636e # v3.1.2
        with:
          cache: true
          require-lockfile: true
          cache-dependency-path: |
            pnpm-lock.yaml
            infra/pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile
        working-directory: infra

      - name: CDK Synth
        run: pnpm run synth
        working-directory: infra
        env:
          SLACK_BOT_TOKEN: dummy
          SLACK_SIGNING_SECRET: dummy
          TIMES_ALL_CHANNEL_ID: C0000000000
          WORKSPACE_URL: https://dummy.slack.com
